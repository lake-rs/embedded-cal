[package]
name = "embedded-cal-rand"
description = "Making a cryptographically secure random number generator accessible in embedded-cal"
documentation = "https://docs.rs/embedded-cal-rand/"

edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true

[dependencies]
embedded-cal.workspace = true

rand_core.workspace = true

rand = {version = "0.10", optional = true, features = ["std_rng", "sys_rng"], default-features = false }

[features]
## Enables the [`WithRng::new_with_sys()`] constructor.
##
## This takes its randomness from the operating system through `getrandom`. On
## bare metal targets, it only builds if a [custom `getrandom` backend] is
## provided; without one, pass an existing RNG to `WithRng::new()` instead.
##
## [custom `getrandom` backend]: https://docs.rs/getrandom/0.4/#custom-backend
new_from_sys = ["dep:rand"]

[package.metadata.docs.rs]
all-features = true
