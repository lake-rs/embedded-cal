[workspace]
members = [
    "embedded-cal",
    "embedded-cal-rustcrypto",
    "embedded-cal-software-demo",
    "embedded-cal-nrf54l15",
    "embedded-cal-stm32wba55",
    "testvectors",
    "embedded-cal-libcrux",
    "embedded-cal-rand",
    "embedded-cal-examples"
]
default-members = [
    "embedded-cal",
    "embedded-cal-rustcrypto",
    "embedded-cal-libcrux",
    "embedded-cal-software-demo",
    "testvectors",
    "embedded-cal-rand",
    "embedded-cal-examples"
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/lake-rs/embedded-cal.git"
keywords = [
    "iot",
    "security",
    "crypto",
    "embedded"
]
categories = [
    "cryptography",
    "hardware-support",
    "embedded",
    "no-std::no-alloc"
]
version = "0.2.0-alpha.1"

[workspace.dependencies]
hax-lib = "0.4.0"
rand_core = { version = "0.10", default-features = false }
embedded-cal = { version = "0.2.0-alpha.1", path = "./embedded-cal" }

# We don't need to list all lockstepped workspace crates here, just those that
# are being depended on.
#
# (And not all of them will be version-lockstepped forever.).
embedded-cal-rand = { version = "0.2.0-alpha.1", path = "./embedded-cal-rand" }

# used by embedded-cal-exampless
embedded-cal-rustcrypto = { version = "0.2.0-alpha.1", path = "./embedded-cal-rustcrypto" }
embedded-cal-libcrux = { version = "0.2.0-alpha.1", path = "./embedded-cal-libcrux" }

[workspace.metadata.release]
sign-tag = true
