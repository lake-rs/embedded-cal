[package]
name = "embedded-cal-nrf54l15"
description = "Implementation of embedded-cal for nRF54L15 hardware"

edition.workspace = true
license = "(MIT OR Apache-2.0) AND LicenseRef-Nordic-5-Clause"
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true

[lib]
# While the crate is already excluded from the workspace's defaults, setting
# this also means that when `cargo test` is run in here, cargo reaches into the
# local .cargo that sets up target and runner.
test = false

[[test]]
name = "integration"
harness = false

[dependencies]
embedded-cal.workspace = true
nrf-pac = { version = "0.2.0", features = ["nrf54l15-app", "rt"] }
rand_core.workspace = true
zeroize = { version = "1.8.2", default-features = false, features = ["derive"]}

[dev-dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7", features = ["device"] }
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
defmt-test = "0.4"
embedded-cal-examples.path = "../embedded-cal-examples"
embedded-cal-software-demo.path = "../embedded-cal-software-demo"
testvectors.path = "../testvectors"
