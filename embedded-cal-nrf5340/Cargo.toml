[package]
name = "embedded-cal-nrf5340"
description = "Implementation of embedded-cal for nRF5340 hardware (CryptoCell-312)"
documentation = "https://docs.rs/embedded-cal-nrf5340/"

edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true

[lib]
# While the crate is already excluded from the workspace's defaults, setting
# this also means that when `cargo test` is run in here, cargo reaches into the
# local .cargo that sets up target and runner.
test = false

[dependencies]
embedded-cal.workspace = true
nrf-pac = { version = "0.4.0", features = ["nrf5340-app", "rt"] }

